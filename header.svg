<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d"/>
      <stop offset="50%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#0d0d0d"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f5ff">
        <animate attributeName="stop-color" values="#00f5ff;#a855f7;#00f5ff" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#06b6d4;#a855f7" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#06b6d4">
        <animate attributeName="stop-color" values="#06b6d4;#00f5ff;#06b6d4" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="30%" style="stop-color:#00f5ff"/>
      <stop offset="70%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="svgClip">
      <rect width="900" height="280" rx="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)"/>

  <!-- Animated grid lines -->
  <g clip-path="url(#svgClip)" opacity="0.07">
    <line x1="0" y1="40" x2="900" y2="40" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="900" y2="80" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="900" y2="120" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="900" y2="160" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="900" y2="200" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="90" y1="0" x2="90" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="180" y1="0" x2="180" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="270" y1="0" x2="270" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="450" y1="0" x2="450" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="540" y1="0" x2="540" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="630" y1="0" x2="630" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
    <line x1="810" y1="0" x2="810" y2="280" stroke="#00f5ff" stroke-width="0.5"/>
  </g>

  <!-- Animated orbs / glowing circles -->
  <circle cx="820" cy="60" r="80" fill="#a855f7" opacity="0.06" filter="url(#strongGlow)">
    <animate attributeName="r" values="80;100;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.12;0.06" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="220" r="70" fill="#00f5ff" opacity="0.06" filter="url(#strongGlow)">
    <animate attributeName="r" values="70;90;70" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.06;0.1;0.06" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="450" cy="140" r="120" fill="#06b6d4" opacity="0.03" filter="url(#strongGlow)">
    <animate attributeName="r" values="120;150;120" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Floating particles -->
  <circle cx="150" cy="50" r="2" fill="#00f5ff" opacity="0.6" filter="url(#glow)">
    <animate attributeName="cy" values="50;30;50" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="200" r="1.5" fill="#a855f7" opacity="0.7" filter="url(#glow)">
    <animate attributeName="cy" values="200;180;200" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="40" r="1.5" fill="#06b6d4" opacity="0.5" filter="url(#glow)">
    <animate attributeName="cy" values="40;55;40" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="240" r="2" fill="#00f5ff" opacity="0.4" filter="url(#glow)">
    <animate attributeName="cy" values="240;225;240" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.05;0.4" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="820" cy="150" r="1.5" fill="#a855f7" opacity="0.5" filter="url(#glow)">
    <animate attributeName="cy" values="150;165;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0.1;0.5" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="50" cy="130" r="1" fill="#06b6d4" opacity="0.6" filter="url(#glow)">
    <animate attributeName="cy" values="130;115;130" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Border glow -->
  <rect width="900" height="280" rx="16" fill="none" stroke="url(#lineGrad)" stroke-width="1" opacity="0.4"/>

  <!-- Top accent line animated -->
  <rect x="0" y="0" width="900" height="2" rx="1" fill="url(#lineGrad)" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets - top left -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#00f5ff" stroke-width="2" fill="none" opacity="0.6" filter="url(#glow)"/>
  <!-- Corner brackets - top right -->
  <path d="M 880 50 L 880 20 L 850 20" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6" filter="url(#glow)"/>
  <!-- Corner brackets - bottom left -->
  <path d="M 20 230 L 20 260 L 50 260" stroke="#a855f7" stroke-width="2" fill="none" opacity="0.6" filter="url(#glow)"/>
  <!-- Corner brackets - bottom right -->
  <path d="M 880 230 L 880 260 L 850 260" stroke="#00f5ff" stroke-width="2" fill="none" opacity="0.6" filter="url(#glow)"/>

  <!-- Status indicator -->
  <circle cx="40" cy="40" r="5" fill="#22c55e" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="52" y="44" font-family="'Courier New', monospace" font-size="10" fill="#22c55e" opacity="0.8">SYSTEM ONLINE</text>

  <!-- Main name -->
  <text x="450" y="115" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="52"
    font-weight="bold"
    fill="url(#nameGrad)"
    filter="url(#strongGlow)"
    letter-spacing="4">
    OSMAR BETANCOURT
  </text>

  <!-- Subtitle line -->
  <rect x="200" y="128" width="500" height="1" fill="url(#lineGrad)" opacity="0.6"/>

  <!-- Animated typewriter roles -->
  <text x="450" y="165" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="16"
    fill="#94a3b8"
    letter-spacing="2">
    <tspan fill="#00f5ff" filter="url(#textGlow)">▸ </tspan>
    <tspan id="role">AI Platform Engineer</tspan>
    <tspan fill="#00f5ff" filter="url(#textGlow)" opacity="0.8">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
      |
    </tspan>
  </text>

  <!-- Tags row -->
  <g transform="translate(450, 200)" text-anchor="middle">
    <!-- Tag 1 -->
    <rect x="-390" y="-14" width="112" height="22" rx="4" fill="#00f5ff" opacity="0.08" stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="-334" y="2" font-family="'Courier New', monospace" font-size="10" fill="#00f5ff" text-anchor="middle" letter-spacing="1">🤖 LLM ARCHITECT</text>

    <!-- Tag 2 -->
    <rect x="-265" y="-14" width="96" height="22" rx="4" fill="#a855f7" opacity="0.08" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="-217" y="2" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" text-anchor="middle" letter-spacing="1">⚙️ MCP BUILDER</text>

    <!-- Tag 3 -->
    <rect x="-155" y="-14" width="108" height="22" rx="4" fill="#06b6d4" opacity="0.08" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="-101" y="2" font-family="'Courier New', monospace" font-size="10" fill="#06b6d4" text-anchor="middle" letter-spacing="1">🦀 RUST ENGINEER</text>

    <!-- Tag 4 -->
    <rect x="-33" y="-14" width="98" height="22" rx="4" fill="#00f5ff" opacity="0.08" stroke="#00f5ff" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="16" y="2" font-family="'Courier New', monospace" font-size="10" fill="#00f5ff" text-anchor="middle" letter-spacing="1">🐍 DJANGO EXPERT</text>

    <!-- Tag 5 -->
    <rect x="79" y="-14" width="104" height="22" rx="4" fill="#a855f7" opacity="0.08" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="131" y="2" font-family="'Courier New', monospace" font-size="10" fill="#a855f7" text-anchor="middle" letter-spacing="1">☁️ CLOUD DEVOPS</text>

    <!-- Tag 6 -->
    <rect x="197" y="-14" width="110" height="22" rx="4" fill="#06b6d4" opacity="0.08" stroke="#06b6d4" stroke-width="0.5" stroke-opacity="0.4"/>
    <text x="252" y="2" font-family="'Courier New', monospace" font-size="10" fill="#06b6d4" text-anchor="middle" letter-spacing="1">🚀 FOUNDER DREAMIT</text>
  </g>

  <!-- Bottom status bar -->
  <text x="450" y="248" text-anchor="middle"
    font-family="'Courier New', monospace"
    font-size="10"
    fill="#475569"
    letter-spacing="2">
    CARACAS, VE  ·  OPEN TO COLLABORATION  ·  BUILDING THE FUTURE WITH AI
  </text>

  <!-- Scanning line effect -->
  <rect x="0" y="0" width="900" height="3" fill="url(#lineGrad)" opacity="0.15" rx="1">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,280;0,0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.05;0.15" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
